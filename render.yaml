# Deploy FastAPI backend (Render / Railway / Fly — not Vercel)
# Vercel only hosts the React frontend; point VITE_API_BASE_URL at this service.

services:
  - type: web
    name: financial-research-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NEWS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: financial
      - key: REDIS_URL
        sync: false
      - key: ENV
        value: production
